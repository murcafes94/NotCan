name: Apply web map sidebar
on:
  push:
    paths:
      - '.github/workflows/apply-web-map-sidebar.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply web patch
        run: python3 ci/apply_web_map_sidebar.py
      - name: Commit web corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/App.tsx web/src/features.css web/src/tablet-responsive.css
          git commit -m 'feat(web): separate map canvas and collapsible navigation'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web
        working-directory: web
        run: |
          rm -rf node_modules
          npm ci
          npm run build
