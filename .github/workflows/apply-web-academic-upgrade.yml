name: Apply NotCan web academic upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-web-academic-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finalize academic dashboard styles
        run: python3 ci/apply_web_academic_upgrade.py

      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Commit validated web changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/features.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(web): align academic dashboard theme variables'
          git push
