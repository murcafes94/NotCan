name: Apply polish 0.8.11

on:
  push:
    paths:
      - '.github/trigger-0811.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.8.11 fixes
        run: python3 .github/scripts/apply_0811.py

      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/notcan/app/ui/ai/StudyQuizScreen.kt \
                  app/src/main/java/com/notcan/app/ui/home/WriterNoteEditor.kt \
                  app/src/main/java/com/notcan/app/ui/maps/StudyMapLayoutEngine.kt \
                  app/src/main/java/com/notcan/app/ui/maps/StudyMapScreen.kt
          git commit -m "fix(android): polish quiz maps and note selection"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify persistent test signature
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | tee /tmp/cert.txt
          grep -q "SHA256:" /tmp/cert.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-0.8.11-polish
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Remove temporary patch files
        if: always()
        run: |
          git pull --rebase origin main || true
          git rm -f .github/scripts/apply_0811.py .github/workflows/apply-polish-0811.yml .github/trigger-0811.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove Android 0.8.11 patch files"
            git push origin HEAD:main
          fi
