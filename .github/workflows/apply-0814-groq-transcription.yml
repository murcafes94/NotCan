name: Apply 0.8.14 Groq transcription

on:
  push:
    paths:
      - 'ci/notcan-0814-groq-trigger.txt'
  workflow_dispatch:

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply 0.8.14 Groq wiring
        run: python3 ci/apply_0814_groq_wiring.py

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'feat(android): add Groq Whisper Large V3 transcription'
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          EXPECTED='ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586'
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload Groq test APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-0.8.14-groq-test
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

      - name: Publish 0.8.14 test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='v0.8.14-test'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$APK#NotCan-v0.8.14-groq-test.apk" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title 'NotCan v0.8.14 · prueba Groq' \
            --notes 'Prueba experimental: transcripción final online con Groq Whisper Large V3, clave cifrada con Android Keystore, español y vocabulario académico como contexto sin reescritura semántica, timestamps, división automática de audios grandes, respaldo Whisper local y corrección de Transcribir al terminar.'
