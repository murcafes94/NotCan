name: Apply TuNot Gemma study assistance

on:
  push:
    paths:
      - 'ci/tunot-gemma-study-assistance-trigger.txt'
  workflow_dispatch:

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Apply upgrade in workspace
        run: python3 ci/apply_tunot_gemma_study_assistance.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK before committing
        run: gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          EXPECTED='ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586'
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Remove temporary migration files
        run: |
          rm -f ci/apply_tunot_gemma_study_assistance.py
          rm -f ci/tunot-gemma-study-assistance-trigger.txt
          rm -f .github/workflows/apply-tunot-gemma-study-assistance.yml

      - name: Commit validated upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(android): expand Gemma with study, pedagogy, web and vocabulary'
          git push

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-v0.8.21-gemma-study-assistance
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
