name: Test Qwen2.5 Local TuNot

on:
  push:
    branches:
      - qwen25-local-test
    paths:
      - .github/workflows/qwen25-local-test.yml

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Qwen2.5 patch
        run: python3 ci/apply_qwen25_local.py

      - name: Build ARM64
        run: gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace

      - name: Commit tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/build.gradle.kts \
            app/src/main/java/com/notcan/app/localai/StudyModelManager.kt \
            app/src/main/java/com/notcan/app/ai/LocalLfmTuNotEngine.kt \
            app/src/main/java/com/notcan/app/ai/LocalQwenTuNotEngine.kt \
            app/src/main/java/com/notcan/app/ai/NotCanAiService.kt \
            app/src/main/java/com/notcan/app/settings/NotCanPreferences.kt \
            app/src/main/java/com/notcan/app/ui/settings/SettingsScreen.kt \
            app/src/main/java/com/notcan/app/ui/ai/NotCanAiScreen.kt
          git commit -m 'feat(android): replace LFM2.5 with Qwen2.5 local TuNot' || true
          git push origin HEAD:qwen25-local-test
