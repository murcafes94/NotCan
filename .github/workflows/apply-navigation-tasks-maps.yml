name: Apply navigation tasks maps

on:
  push:
    paths:
      - 'ci/notcan-nav-trigger.txt'
  workflow_dispatch:

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 ci/apply_navigation_tasks_maps.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'feat(android): add home tasks and improve maps'
          git push
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          EXPECTED='ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586'
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notcan-0.8.3-home-tasks-maps
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      - name: Publish 0.8.3 test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='v0.8.3-test'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK#NotCan-v0.8.3-test.apk" --target "$(git rev-parse HEAD)" --prerelease --title 'NotCan v0.8.3 · prueba' --notes 'Inicio separado de Materias, módulo Tareas con checklist, navegación lateral oculta fuera de Inicio y mapas con lienzo arriba, controles abajo y nodos adaptados al contenido.'
