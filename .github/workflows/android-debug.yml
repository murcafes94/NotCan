name: Android Debug Build

on:
  push:
    branches: [ "main", "feature/v0.7-focus-background" ]
  workflow_dispatch:

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Keep only the newest previous APK artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          echo "Existing APK artifacts:"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | "\(.id)  \(.created_at)  \(.name)"' || true

          mapfile -t old_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id'
          )

          if [ "${#old_ids[@]}" -eq 0 ]; then
            echo "No old artifacts to delete; keeping the newest existing artifact."
          else
            for artifact_id in "${old_ids[@]}"; do
              echo "Deleting old artifact ${artifact_id}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done
          fi

          echo "Artifacts kept before new build:"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | "\(.id)  \(.created_at)  \(.name)"' || true

  build:
    needs: cleanup-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: notcan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
