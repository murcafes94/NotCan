name: Apply v0.8.25 audit cloud

on:
  push:
    branches: [ "audit-cloud-0825" ]
  workflow_dispatch:

jobs:
  apply-build:
    if: ${{ !contains(github.event.head_commit.message, '[0825 applied]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit-cloud-0825

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply audited patch
        run: python3 ci/apply_0825_audit_cloud.py

      - name: Build debug APK
        run: gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          # The patch script also refreshes rolling-build metadata, but Actions tokens
          # are not allowed to push workflow-file changes. Keep runtime changes only;
          # workflow metadata can be updated separately by the repository connector.
          git checkout -- .github/workflows/android-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(android): audit storage, calendar and cloud docs [0825 applied]"
            git push origin HEAD:audit-cloud-0825
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-v0.8.25-audit-cloud
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
