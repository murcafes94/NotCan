name: Web TuNot Context Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-tunot-context-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TuNot context routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/src/App.tsx')
          s = p.read_text()
          old = """  async function askTuNot(prompt: string, mode: AiMode): Promise<{ answer: string; model?: string }> {\n    if (!session) throw new Error('Inicia sesión para usar TuNot en la web.')\n    const response = await askNotCanAi({ prompt, mode, context: aiUseNotes ? noteContext() : [] })\n    return { answer: response.answer, model: response.model ?? undefined }\n  }\n"""
          new = """  async function askTuNot(prompt: string, mode: AiMode, useContextOverride = aiUseNotes): Promise<{ answer: string; model?: string }> {\n    if (!session) throw new Error('Inicia sesión para usar TuNot en la web.')\n    const response = await askNotCanAi({ prompt, mode, context: useContextOverride ? noteContext() : [] })\n    return { answer: response.answer, model: response.model ?? undefined }\n  }\n"""
          if old not in s:
              raise SystemExit('Expected askTuNot block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/App.tsx
          git commit -m 'fix(web): force context for TuNot study actions'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
