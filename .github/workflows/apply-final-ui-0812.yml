name: Apply Android 0.8.12 final UI fixes

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-final-ui-0812.yml"
      - ".github/scripts/patch_0812.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply 0.8.12 corrections
        run: python3 .github/scripts/patch_0812.py

      - name: Commit functional changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix(android): finish tablet navigation and editor ergonomics"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary patch files
        if: always()
        shell: bash
        run: |
          set +e
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/patch_0812.py .github/workflows/apply-final-ui-0812.yml
          git commit -m "chore: remove Android 0.8.12 patch files"
          git push origin HEAD:main
