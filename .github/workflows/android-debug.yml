name: Android Optimized Test Build

on:
  push:
    branches: [ "main", "feature/**", "fix/**" ]
  workflow_dispatch:

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Keep only the newest previous APK artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          echo "Existing APK artifacts:"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | "\(.id)  \(.created_at)  \(.name)"' || true

          mapfile -t old_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id'
          )

          if [ "${#old_ids[@]}" -eq 0 ]; then
            echo "No old artifacts to delete; keeping the newest existing artifact."
          else
            for artifact_id in "${old_ids[@]}"; do
              echo "Deleting old artifact ${artifact_id}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done
          fi

  build:
    needs: cleanup-artifacts
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build optimized release APK
        run: gradle :app:assembleRelease -PnotcanArm64Only=true --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify baseline profile packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" | grep -E 'assets/dexopt/baseline\.(prof|profm)'

      - name: Upload optimized APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: notcan-v0.8.31-adaptive-performance-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish rolling test release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.8.31-test"
          APK="app/build/outputs/apk/release/app-release.apk"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$APK#NotCan-v0.8.31.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NotCan v0.8.31 · Gemma más eficiente" \
            --notes "Build v0.8.31. Conserva los artefactos de aceleración de LiteRT fuera de la caché temporal, precarga Gemma al abrir TuNot cuando está seleccionado, reduce el contexto de preguntas focalizadas y libera el motor tras 10 minutos sin uso. Las métricas distinguen backend de carga y respuesta para detectar fallback GPU/CPU. Mantiene Groq/Whisper, Baseline/Startup Profiles y LiteRT-LM 0.11.0."
