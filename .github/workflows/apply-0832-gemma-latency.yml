name: Apply 0.8.32 Gemma latency tuning

on:
  push:
    branches: [ "feature/perf-latency-0832" ]
    paths:
      - "ci/apply_0832_gemma_latency.py"
      - ".github/workflows/apply-0832-gemma-latency.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/perf-latency-0832
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply latency patch
        run: python ci/apply_0832_gemma_latency.py

      - name: Compile Android
        run: gradle :app:compileReleaseKotlin -PnotcanArm64Only=true --stacktrace

      - name: Commit validated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/notcan/app/ai/LiteRtGemmaTuNotEngine.kt \
            app/src/main/java/com/notcan/app/ai/NotCanAiService.kt \
            app/src/main/java/com/notcan/app/ui/NotCanViewModel.kt
          if git diff --cached --quiet; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git commit -m "perf(android): reduce Gemma cold-start and prompt latency [0832 applied]"
          git push origin HEAD:feature/perf-latency-0832
