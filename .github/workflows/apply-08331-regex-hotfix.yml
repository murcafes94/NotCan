name: Apply 0.8.33.1 regex hotfix

on:
  push:
    branches: [ "fix/v0.8.33.1-regex" ]

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[08331 applied]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.8.33.1-regex
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Patch, compile and commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('app/src/main/java/com/notcan/app/ai/LiteRtGemmaTuNotEngine.kt')
          text = engine.read_text()
          old1 = r'.replace(Regex("""\$\s*\\text\{([^{}]+)}\s*\$""")) { it.groupValues[1] }'
          new1 = r'.replace(Regex("""\$\s*\\text\{([^{}]+)\}\s*\$""")) { it.groupValues[1] }'
          old2 = r'.replace(Regex("""\\text\{([^{}]+)}""")) { it.groupValues[1] }'
          new2 = r'.replace(Regex("""\\text\{([^{}]+)\}""")) { it.groupValues[1] }'
          assert old1 in text, 'No se encontró regex LaTeX principal'
          assert old2 in text, 'No se encontró regex LaTeX secundaria'
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          engine.write_text(text)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          assert 'versionCode = 56' in g and 'versionName = "0.8.33"' in g
          g = g.replace('versionCode = 56', 'versionCode = 57', 1)
          g = g.replace('versionName = "0.8.33"', 'versionName = "0.8.33.1"', 1)
          gradle.write_text(g)
          PY

          gradle :app:compileReleaseKotlin -PnotcanArm64Only=true --stacktrace

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/notcan/app/ai/LiteRtGemmaTuNotEngine.kt
          git commit -m "fix(tunot): escape Android regex braces [08331 applied]"
          git push origin HEAD:fix/v0.8.33.1-regex
