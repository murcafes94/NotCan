name: Apply 0.8.33 TuNot quality tuning

on:
  push:
    branches: [ "feature/tunot-quality-0833" ]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tunot-quality-0833
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply, compile and commit TuNot quality tuning
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[0833 applied\]'; then
            echo "v0.8.33 patch already applied; nothing to do."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          engine = Path('app/src/main/java/com/notcan/app/ai/LiteRtGemmaTuNotEngine.kt')
          text = engine.read_text()

          old = 'if (simpleDefinition && !preferences.aiDetail.equals("Profundo", ignoreCase = true)) return "Extensión: responde con una explicación clara y completa en 2–4 párrafos breves; evita convertir una pregunta puntual en un ensayo."'
          new = 'if (simpleDefinition && !preferences.aiDetail.equals("Profundo", ignoreCase = true)) return "Extensión: responde en 1–2 párrafos breves (aprox. 60–140 palabras), sin apartados numerados salvo que se pidan. Define primero el término y añade solo la distinción o contexto esencial; evita convertir una pregunta puntual en un ensayo."'
          assert old in text, 'No se encontró la regla de definición simple'
          text = text.replace(old, new, 1)

          old = 'appendLine("No inventes citas, páginas, autores, fechas ni referencias.")\n        appendLine("No muestres cadena de pensamiento ni razonamiento interno; entrega directamente la respuesta útil.")\n        appendLine("En teología católica distingue enseñanza oficial, disciplina, opinión teológica e interpretación académica.")'
          new = 'appendLine("No inventes citas, páginas, autores, fechas ni referencias.")\n        appendLine("Usa Markdown simple compatible con la interfaz. No uses LaTeX, delimitadores $...$, \\\\(...\\\\), \\\\[...\\\\] ni comandos como \\\\text{} salvo que el estudiante pida expresamente notación matemática; escribe términos y símbolos en texto normal siempre que sea posible.")\n        appendLine("No muestres cadena de pensamiento ni razonamiento interno; entrega directamente la respuesta útil.")\n        appendLine("En teología católica distingue enseñanza oficial, disciplina, opinión teológica e interpretación académica.")\n        appendLine("En terminología patrística, trinitaria y cristológica conserva con rigor las distinciones entre naturaleza/esencia (ousia, physis), hipóstasis/persona y prosopon; no identifiques sin más hipóstasis o persona con esencia o naturaleza. Si una equivalencia es discutida o depende del autor/época, indícalo con prudencia.")'
          assert old in text, 'No se encontró el bloque de instrucciones del sistema'
          text = text.replace(old, new, 1)

          text = text.replace('onPartial?.invoke(output.toString(), engineHolder.backendLabel)', 'onPartial?.invoke(cleanModelText(output.toString()), engineHolder.backendLabel)')
          assert 'val text = output.toString().trim()' in text, 'No se encontró el texto final de generación'
          text = text.replace('val text = output.toString().trim()', 'val text = cleanModelText(output.toString()).trim()', 1)

          marker = '    /**\n     * Builds a small local RAG context instead of blindly taking the tail of every source.\n'
          assert marker in text, 'No se encontró el punto de inserción del limpiador'
          cleaner_lines = [
              '    private fun cleanModelText(raw: String): String {',
              '        if (raw.isBlank() || looksLikeStudyArtifact(raw)) return raw.trim()',
              '        return raw',
              '            .replace(Regex("""\\$\\s*\\\\text\\{([^{}]+)}\\s*\\$""")) { it.groupValues[1] }',
              '            .replace(Regex("""\\\\text\\{([^{}]+)}""")) { it.groupValues[1] }',
              '            .replace(Regex("""\\\\\\(([^)\\n]+)\\\\\\)""")) { it.groupValues[1].trim() }',
              '            .replace(Regex("""\\\\\\[([^\\]\\n]+)\\\\\\]""")) { it.groupValues[1].trim() }',
              '            .replace(Regex("""\\$\\s*([^$\\n]{1,120})\\s*\\$""")) { it.groupValues[1].trim() }',
              '            .trim()',
              '    }',
              ''
          ]
          cleaner = '\n'.join(cleaner_lines) + '\n'
          text = text.replace(marker, cleaner + marker, 1)
          engine.write_text(text)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          assert 'versionCode = 55' in g and 'versionName = "0.8.32"' in g
          g = g.replace('versionCode = 55', 'versionCode = 56', 1).replace('versionName = "0.8.32"', 'versionName = "0.8.33"', 1)
          gradle.write_text(g)
          PY

          gradle :app:compileReleaseKotlin -PnotcanArm64Only=true --stacktrace

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/notcan/app/ai/LiteRtGemmaTuNotEngine.kt
          git commit -m "feat(tunot): improve concise answers and output formatting [0833 applied]"
          git push origin HEAD:feature/tunot-quality-0833
