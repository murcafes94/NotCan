name: Apply web research 0.8.8
on:
  push:
    paths:
      - '.github/workflows/apply-web-research-088.yml'
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply NotCan 0.8.8 web research
        run: python3 scripts/apply_web_sources_088.py
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/notcan/app/sources/ClassSourceStore.kt app/src/main/java/com/notcan/app/ui/ai/AiExternalSourcesPanel.kt app/src/main/java/com/notcan/app/ai/NotCanAiService.kt app/src/main/java/com/notcan/app/ui/ai/NotCanAiScreen.kt app/build.gradle.kts
          git commit -m 'feat(android): add TuNot web research and saved web sources'
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          EXPECTED='ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586'
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary files
        if: always()
        run: |
          rm -f .github/workflows/apply-web-research-088.yml scripts/apply_web_sources_088.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove Android 0.8.8 patch files'
            git push
          fi
