name: Apply Web Phase 1 + cycle management

on:
  push:
    paths:
      - 'ci/notcan-web-phase1-trigger.txt'
  workflow_dispatch:

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Web Phase 1 and cycle management
        run: python3 ci/apply_web_phase1_cycles.py

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app web
          if ! git diff --cached --quiet; then
            git commit -m 'feat: web phase 1 and manual cycle management'
            git push
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          GITHUB_PAGES: true
          VITE_SUPABASE_URL: https://xpkxvhnttquvnbcfnbck.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_wTChkG7BwOd00sz67lOWDQ_dZ8XdYpV
        run: |
          npm ci
          npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: notcan-web-phase1
          path: web/dist
          retention-days: 5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android ARM64
        run: gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          EXPECTED='ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586'
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-0.8.17.2-cycle-management-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

      - name: Publish Android test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='v0.8.17.2-test'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$APK#NotCan-v0.8.17.2-test-arm64.apk" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title 'NotCan v0.8.17.2 · ciclos manuales' \
            --notes 'Permite administrar y eliminar manualmente ciclos académicos con resumen de contenido. Incluye la primera fase de alineación de NotCan Web: tema claro/oscuro, ciclo activo y navegación de Materias sin autoselección.'
