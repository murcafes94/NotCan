name: Apply LFM2.5 Local TuNot Experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-lfm25-local.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Update llama.cpp to LFM2-compatible revision
        shell: bash
        run: |
          set -euo pipefail
          TARGET='5516b9c16aed771b42403aca9a561af61a564c25'
          git -C third_party/llama.cpp fetch origin "$TARGET"
          git -C third_party/llama.cpp checkout --detach "$TARGET"

      - name: Install LFM2.5 model manager and local engine
        shell: bash
        run: |
          cat > app/src/main/java/com/notcan/app/localai/StudyModelManager.kt <<'KOTLIN'
          package com.notcan.app.localai

          import android.app.DownloadManager
          import android.content.Context
          import android.net.Uri
          import java.io.File

          object StudyModelSpec {
              const val DISPLAY_NAME = "TuNot offline · LFM2.5"
              const val MODEL_NAME = "LFM2.5 1.2B Instruct Q4_K_M"
              const val FILE_NAME = "LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
              const val DOWNLOAD_URL = "https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LFM2.5-1.2B-Instruct-Q4_K_M.gguf?download=true"
              const val APPROX_BYTES = 731_000_000L
              const val MIN_VALID_BYTES = 700_000_000L
              const val LICENSE = "LFM Open License 1.0"
              const val SHA256 = "b1b3de114215d9507409a662a501a631095a479a419584e8a2ded6304b19b4f5"

              const val LEGACY_QWEN_FILE_NAME = "Qwen3-0.6B-Q8_0.gguf"
              const val LEGACY_DEEPSEEK_FILE_NAME = "DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf"
          }

          enum class StudyModelState {
              NOT_INSTALLED,
              DOWNLOADING,
              INSTALLED
          }

          class StudyModelManager(private val context: Context) {
              private val prefs = context.getSharedPreferences("notcan_study_model", Context.MODE_PRIVATE)

              fun modelFile(): File {
                  val dir = context.getExternalFilesDir("models") ?: File(context.filesDir, "models")
                  dir.mkdirs()
                  return File(dir, StudyModelSpec.FILE_NAME)
              }

              private fun legacyModelFiles(): List<File> {
                  val parent = modelFile().parentFile
                  return listOf(
                      File(parent, StudyModelSpec.LEGACY_QWEN_FILE_NAME),
                      File(parent, StudyModelSpec.LEGACY_DEEPSEEK_FILE_NAME)
                  )
              }

              fun state(): StudyModelState {
                  if (isValidModel(modelFile())) return StudyModelState.INSTALLED

                  val id = prefs.getLong(KEY_DOWNLOAD_ID, -1L)
                  if (id > 0L) {
                      val manager = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                      manager.query(DownloadManager.Query().setFilterById(id))?.use { cursor ->
                          if (cursor.moveToFirst()) {
                              val status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))
                              if (status == DownloadManager.STATUS_RUNNING ||
                                  status == DownloadManager.STATUS_PENDING ||
                                  status == DownloadManager.STATUS_PAUSED
                              ) return StudyModelState.DOWNLOADING
                          }
                      }
                  }
                  return StudyModelState.NOT_INSTALLED
              }

              fun enqueueDownload(): Long {
                  if (state() == StudyModelState.INSTALLED) return -1L
                  val existingId = prefs.getLong(KEY_DOWNLOAD_ID, -1L)
                  if (existingId > 0L && state() == StudyModelState.DOWNLOADING) return existingId

                  val destination = modelFile()
                  if (destination.exists()) destination.delete()

                  val manager = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  val request = DownloadManager.Request(Uri.parse(StudyModelSpec.DOWNLOAD_URL))
                      .setTitle("NotCan · TuNot offline")
                      .setDescription("LFM2.5 1.2B Instruct Q4_K_M · aprox. 731 MB · sin costo por tokens")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      .setAllowedOverRoaming(false)
                      .setAllowedOverMetered(true)
                      .setDestinationInExternalFilesDir(context, "models", StudyModelSpec.FILE_NAME)
                  return manager.enqueue(request).also { id -> prefs.edit().putLong(KEY_DOWNLOAD_ID, id).apply() }
              }

              fun importExistingModel(uri: Uri): Boolean {
                  val destination = modelFile()
                  val staging = File(destination.parentFile, "${destination.name}.importing")
                  staging.delete()
                  val input = context.contentResolver.openInputStream(uri)
                      ?: throw IllegalArgumentException("No se pudo abrir el archivo seleccionado")

                  try {
                      input.buffered().use { source ->
                          staging.outputStream().buffered().use { output -> source.copyTo(output) }
                      }
                      if (!isValidModel(staging)) {
                          throw IllegalArgumentException("El archivo no parece ser LFM2.5 1.2B Instruct Q4_K_M en formato GGUF o está incompleto")
                      }
                      if (destination.exists() && !destination.delete()) {
                          throw IllegalStateException("No se pudo reemplazar el modelo local anterior")
                      }
                      if (!staging.renameTo(destination)) {
                          staging.copyTo(destination, overwrite = true)
                          staging.delete()
                      }
                      if (!isValidModel(destination)) {
                          destination.delete()
                          throw IllegalStateException("El modelo importado no pudo validarse")
                      }
                      val downloadId = prefs.getLong(KEY_DOWNLOAD_ID, -1L)
                      if (downloadId > 0L) runCatching {
                          (context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).remove(downloadId)
                      }
                      prefs.edit().remove(KEY_DOWNLOAD_ID).apply()
                      return true
                  } catch (t: Throwable) {
                      staging.delete()
                      throw t
                  }
              }

              fun progressPercent(): Int? {
                  val id = prefs.getLong(KEY_DOWNLOAD_ID, -1L)
                  if (id <= 0L) return null
                  val manager = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  manager.query(DownloadManager.Query().setFilterById(id))?.use { cursor ->
                      if (!cursor.moveToFirst()) return null
                      val downloaded = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR))
                      val total = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES))
                      if (downloaded < 0L || total <= 0L) return null
                      return ((downloaded * 100L) / total).toInt().coerceIn(0, 100)
                  }
                  return null
              }

              fun removeModel(): Boolean {
                  val id = prefs.getLong(KEY_DOWNLOAD_ID, -1L)
                  if (id > 0L) runCatching {
                      (context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).remove(id)
                  }
                  prefs.edit().remove(KEY_DOWNLOAD_ID).apply()
                  val currentDeleted = !modelFile().exists() || modelFile().delete()
                  val legacyDeleted = legacyModelFiles().all { !it.exists() || it.delete() }
                  return currentDeleted && legacyDeleted
              }

              private fun isValidModel(file: File): Boolean {
                  if (!file.exists() || file.length() < StudyModelSpec.MIN_VALID_BYTES) return false
                  return runCatching {
                      file.inputStream().buffered().use { input ->
                          val header = ByteArray(4)
                          input.read(header) == 4 && header.contentEquals(
                              byteArrayOf('G'.code.toByte(), 'G'.code.toByte(), 'U'.code.toByte(), 'F'.code.toByte())
                          )
                      }
                  }.getOrDefault(false)
              }

              companion object { private const val KEY_DOWNLOAD_ID = "download_id" }
          }
          KOTLIN

          cat > app/src/main/java/com/notcan/app/ai/LocalLfmTuNotEngine.kt <<'KOTLIN'
          package com.notcan.app.ai

          import android.content.Context
          import com.arm.aichat.AiChat
          import com.arm.aichat.InferenceEngine
          import com.notcan.app.localai.StudyModelManager
          import com.notcan.app.localai.StudyModelState
          import kotlinx.coroutines.flow.collect
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock
          import kotlinx.coroutines.withTimeout

          /** Experimental on-device TuNot brain backed by LiquidAI LFM2.5 + llama.cpp. */
          class LocalLfmTuNotEngine(context: Context) {
              private val appContext = context.applicationContext
              private val modelManager = StudyModelManager(appContext)
              private val mutex = Mutex()

              fun isAvailable(): Boolean = runCatching {
                  modelManager.state() == StudyModelState.INSTALLED
              }.getOrDefault(false)

              suspend fun answer(
                  subjectName: String?,
                  notes: String,
                  transcript: String,
                  question: String,
                  strictSources: Boolean
              ): String = mutex.withLock {
                  check(isAvailable()) { "LFM2.5 no está instalado" }
                  val engine = AiChat.getInferenceEngine(appContext)
                  ensureModelReady(engine)

                  val sourceContext = buildString {
                      subjectName?.takeIf { it.isNotBlank() }?.let { appendLine("Materia: $it") }
                      if (notes.isNotBlank()) {
                          appendLine("\n[Apuntes]")
                          appendLine(notes.takeLast(MAX_SOURCE_PART_CHARS))
                      }
                      if (transcript.isNotBlank()) {
                          appendLine("\n[Transcripción]")
                          appendLine(transcript.takeLast(MAX_SOURCE_PART_CHARS))
                      }
                  }.takeLast(MAX_SOURCE_CHARS)

                  val prompt = buildString {
                      if (strictSources) {
                          appendLine("Modo SOLO MIS FUENTES: responde únicamente con el material incluido. Si no consta, dilo claramente.")
                      } else {
                          appendLine("Usa el material de clase cuando sea pertinente. Si respondes con conocimiento general, no lo presentes como cita de los apuntes.")
                      }
                      if (sourceContext.isNotBlank()) {
                          appendLine("\n--- MATERIAL DE NOTCAN ---")
                          appendLine(sourceContext)
                          appendLine("--- FIN DEL MATERIAL ---")
                      }
                      appendLine("\nPregunta del estudiante:")
                      append(question.trim())
                  }

                  val output = StringBuilder()
                  withTimeout(GENERATION_TIMEOUT_MS) {
                      engine.sendUserPrompt(prompt, PREDICT_TOKENS).collect { token -> output.append(token) }
                  }
                  output.toString().trim().ifBlank { error("LFM2.5 no produjo una respuesta") }
              }

              private suspend fun ensureModelReady(engine: InferenceEngine) {
                  var state = withTimeout(INIT_TIMEOUT_MS) {
                      engine.state.first {
                          it is InferenceEngine.State.Initialized ||
                              it is InferenceEngine.State.ModelReady ||
                              it is InferenceEngine.State.Error
                      }
                  }
                  if (state is InferenceEngine.State.Error) {
                      runCatching { engine.cleanUp() }
                      state = withTimeout(INIT_TIMEOUT_MS) {
                          engine.state.first { it is InferenceEngine.State.Initialized || it is InferenceEngine.State.ModelReady }
                      }
                  }
                  if (state is InferenceEngine.State.ModelReady) return
                  engine.loadModel(modelManager.modelFile().absolutePath)
                  engine.setSystemPrompt(SYSTEM_PROMPT)
              }

              companion object {
                  const val MODEL_LABEL = "LFM2.5 1.2B · local"
                  private const val MAX_SOURCE_PART_CHARS = 4_200
                  private const val MAX_SOURCE_CHARS = 8_400
                  private const val PREDICT_TOKENS = 768
                  private const val INIT_TIMEOUT_MS = 45_000L
                  private const val GENERATION_TIMEOUT_MS = 120_000L
                  private val SYSTEM_PROMPT = """
                      Eres TuNot, tutor académico de NotCan ejecutándose completamente en el dispositivo.
                      Responde en español claro, preciso y útil para estudiar. Prioriza fidelidad a los apuntes y transcripciones proporcionados.
                      No inventes citas, páginas, autores, fechas ni afirmaciones ausentes de una fuente cuando el usuario pida trabajar solo con sus fuentes.
                      Distingue una explicación general de una afirmación tomada del material del estudiante. No muestres cadena de pensamiento.
                      Para teología católica, distingue enseñanza oficial, disciplina, opinión teológica e interpretación académica; no presentes una opinión como magisterio.
                      Usa Markdown sencillo: párrafos breves, títulos solo cuando ayuden y listas cuando sean útiles.
                  """.trimIndent()
              }
          }
          KOTLIN

      - name: Patch Android integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # App module: restore llama.cpp runtime and bump experimental build.
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 38', 'versionCode = 39')
          s = s.replace('versionName = "0.8.17.2"', 'versionName = "0.8.18"')
          marker = '    implementation("com.tom-roush:pdfbox-android:2.0.27.0")\n'
          if 'implementation(project(":llama-android"))' not in s:
              if marker not in s: raise SystemExit('app dependency marker not found')
              s = s.replace(marker, marker + '    implementation(project(":llama-android"))\n')
          p.write_text(s)

          # TuNot routing: Mistral online -> LFM local -> extractive fallback.
          p = Path('app/src/main/java/com/notcan/app/ai/NotCanAiService.kt')
          s = p.read_text()
          prop = '    private val webResearch = WebResearchService(appContext)\n'
          if 'private val localLfm' not in s:
              if prop not in s: raise SystemExit('webResearch marker not found')
              s = s.replace(prop, prop + '    private val localLfm = LocalLfmTuNotEngine(appContext)\n')

          old = '''        if (strictSources && plainNotes.isBlank() && plainTranscript.isBlank()) {
            return "No hay apuntes ni transcripciones disponibles para responder en modo Solo mis fuentes."
        }
        if (!isConfigured()) {
            return OfflineTuNotEngine.answer(
                subjectName = subjectName,
                notes = plainNotes,
                transcript = plainTranscript,
                question = localQuestion
            )
        }
'''
          new = '''        if (strictSources && plainNotes.isBlank() && plainTranscript.isBlank()) {
            return "No hay apuntes ni transcripciones disponibles para responder en modo Solo mis fuentes."
        }

        suspend fun localFallback(): String {
            val lfmEligible = !mapRequest && !flashcardRequest && !quizRequest
            if (lfmEligible && localLfm.isAvailable()) {
                try {
                    return localLfm.answer(
                        subjectName = subjectName,
                        notes = plainNotes,
                        transcript = plainTranscript,
                        question = localQuestion,
                        strictSources = strictSources
                    )
                } catch (_: Throwable) {
                    // El motor extractivo permanece como red de seguridad incluso si llama.cpp falla.
                }
            }
            return OfflineTuNotEngine.answer(
                subjectName = subjectName,
                notes = plainNotes,
                transcript = plainTranscript,
                question = localQuestion
            )
        }

        if (!isConfigured()) return localFallback()
'''
          if old not in s: raise SystemExit('primary offline block not found')
          s = s.replace(old, new)

          old = '''        return runCatching { sendToMistral(prompt) }
            .getOrElse {
                OfflineTuNotEngine.answer(
                    subjectName = subjectName,
                    notes = plainNotes,
                    transcript = plainTranscript,
                    question = localQuestion
                )
            }
'''
          new = '''        return try {
            sendToMistral(prompt)
        } catch (_: Throwable) {
            localFallback()
        }
'''
          if old not in s: raise SystemExit('Mistral fallback block not found')
          s = s.replace(old, new)
          p.write_text(s)

          # Settings: expose LFM2.5 as an optional downloadable offline component.
          p = Path('app/src/main/java/com/notcan/app/ui/settings/SettingsScreen.kt')
          s = p.read_text()
          if 'import com.notcan.app.localai.StudyModelSpec' not in s:
              s = s.replace('import com.notcan.app.localai.StudyModelManager\n', 'import com.notcan.app.localai.StudyModelManager\nimport com.notcan.app.localai.StudyModelSpec\n')
          s = s.replace('legacyStudyManager', 'studyManager').replace('legacyStudyState', 'studyState')
          state_marker = '''    val studyState = remember(refreshTick) {
        runCatching { studyManager.state() }.getOrDefault(StudyModelState.NOT_INSTALLED)
    }
'''
          if 'val studyProgress' not in s:
              if state_marker not in s: raise SystemExit('study state marker not found')
              s = s.replace(state_marker, state_marker + '''    val studyProgress = remember(refreshTick) {
        runCatching { studyManager.progressPercent() }.getOrNull()
    }
''')

          old = '''                if (studyState != StudyModelState.NOT_INSTALLED) {
                    DownloadComponentCard(
                        title = "Modelo IA local anterior",
                        subtitle = "Qwen ya no es el asistente principal; puedes liberar ese espacio.",
                        stateText = if (studyState == StudyModelState.DOWNLOADING) "Descargando" else "Instalado",
                        progress = null,
                        installed = studyState == StudyModelState.INSTALLED,
                        downloading = studyState == StudyModelState.DOWNLOADING,
                        onDownload = {},
                        onRemove = { runCatching { studyManager.removeModel() }; refreshTick++ },
                        allowDownload = false
                    )
                }
'''
          new = '''                DownloadComponentCard(
                    title = StudyModelSpec.DISPLAY_NAME,
                    subtitle = "${StudyModelSpec.MODEL_NAME} · ~731 MB · ${StudyModelSpec.LICENSE} · sin costo por tokens",
                    stateText = when (studyState) {
                        StudyModelState.INSTALLED -> "Instalado · listo para TuNot"
                        StudyModelState.DOWNLOADING -> "Descargando"
                        StudyModelState.NOT_INSTALLED -> "No instalado"
                    },
                    progress = studyProgress,
                    installed = studyState == StudyModelState.INSTALLED,
                    downloading = studyState == StudyModelState.DOWNLOADING,
                    onDownload = {
                        runCatching { studyManager.enqueueDownload() }
                            .onFailure { saveMessage = "LFM2.5: ${it.message ?: "no se pudo iniciar la descarga"}" }
                        refreshTick++
                    },
                    onRemove = { runCatching { studyManager.removeModel() }; refreshTick++ }
                )
'''
          if old not in s: raise SystemExit('legacy study model UI block not found')
          s = s.replace(old, new)
          p.write_text(s)

          # Rolling release metadata for this experiment.
          p = Path('.github/workflows/android-debug.yml')
          s = p.read_text()
          s = s.replace('TAG="v0.8.13-test"', 'TAG="v0.8.18-lfm-test"')
          s = s.replace('app-debug.apk#NotCan-v0.8.13-test.apk', 'app-debug.apk#NotCan-v0.8.18-lfm-test.apk')
          s = s.replace('--title "NotCan v0.8.13 · prueba"', '--title "NotCan v0.8.18 · LFM2.5 local"')
          p.write_text(s)
          PY

      - name: Verify LFM2-compatible submodule and build ARM64 test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = '5516b9c16aed771b42403aca9a561af61a564c25'
          gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace

      - name: Commit tested experiment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/notcan/app/ai/NotCanAiService.kt app/src/main/java/com/notcan/app/ai/LocalLfmTuNotEngine.kt app/src/main/java/com/notcan/app/localai/StudyModelManager.kt app/src/main/java/com/notcan/app/ui/settings/SettingsScreen.kt .github/workflows/android-debug.yml third_party/llama.cpp
          git commit -m 'feat(android): test LFM2.5 as optional offline TuNot'
          git push origin HEAD:main
