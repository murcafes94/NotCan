name: Cleanup Android 0.8.5 temp files
on:
  push:
    paths:
      - '.github/workflows/cleanup-android-085-temp.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary patch infrastructure
        run: |
          rm -f ci/apply_android_video_fixes_085.py
          rm -f ci/fix_android_085_compile.py
          rm -f .github/workflows/apply-android-video-fixes-085.yml
          rm -f .github/workflows/fix-android-085-compile.yml
          rm -f .github/workflows/cleanup-android-085-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove Android 0.8.5 temporary patch workflows'
          git push
