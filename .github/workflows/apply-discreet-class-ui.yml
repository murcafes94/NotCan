name: Apply discreet class UI

on:
  push:
    branches: [ "main" ]
    paths:
      - "ci/notcan-ui-trigger.txt"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply UI patch
        run: python3 ci/apply_discreet_class_ui.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/notcan/app/ui/home/ClassWorkspaceV5.kt \
                  app/src/main/java/com/notcan/app/ui/home/NotCanRootV5.kt \
                  app/src/main/java/com/notcan/app/ui/home/WriterNoteEditor.kt \
                  app/src/main/java/com/notcan/app/ui/grades/GradesScreen.kt \
                  app/build.gradle.kts
          git commit -m "feat(android): polish discreet class controls" || true
          git push origin HEAD:main

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notcan-0.8.2-discreet-ui
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish 0.8.2 test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.8.2-test"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$APK#NotCan-v0.8.2-test.apk" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title "NotCan v0.8.2 · prueba" \
            --notes "Controles de clase discretos, texto en vivo minimizable y navegable al pausar, marcador de momentos importantes, panel lateral ocultable, subrayado contextual y ponderación opcional en calificaciones."
