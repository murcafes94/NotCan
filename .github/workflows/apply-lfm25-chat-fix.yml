name: Apply LFM2.5 Chat Token Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-lfm25-chat-fix.yml

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply fix
        run: python3 ci/fix_lfm25_chat_tokens.py

      - name: Build ARM64
        run: gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add llama-android/src/main/cpp/CMakeLists.txt app/src/main/java/com/notcan/app/ai/LocalLfmTuNotEngine.kt app/build.gradle.kts
          git commit -m 'fix(android): apply LFM2.5 chat template correctly'
          git push origin HEAD:main
