name: Deploy NotCan Web

on:
  push:
    branches: [ "feature/web-pwa-sync-foundation" ]
    paths:
      - "web/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build PWA
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://xpkxvhnttquvnbcfnbck.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_wTChkG7BwOd00sz67lOWDQ_dZ8XdYpV
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
