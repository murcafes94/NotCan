name: Android Debug Build

on:
  push:
    branches: [ "main", "feature/**", "feature-study-maps", "fix/**", "notcan-v0.7.7-mistral" ]
  workflow_dispatch:

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Keep only the newest previous APK artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          echo "Existing APK artifacts:"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | "\(.id)  \(.created_at)  \(.name)"' || true

          mapfile -t old_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id'
          )

          if [ "${#old_ids[@]}" -eq 0 ]; then
            echo "No old artifacts to delete; keeping the newest existing artifact."
          else
            for artifact_id in "${old_ids[@]}"; do
              echo "Deleting old artifact ${artifact_id}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done
          fi

  build:
    needs: cleanup-artifacts
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: notcan-v0.8.20-gemma4-litert-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish rolling test release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.8.20-gemma-litert-test"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$APK#NotCan-v0.8.20-Gemma4-LiteRT.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NotCan v0.8.20 · Gemma 4 LiteRT local" \
            --notes "Primera prueba de TuNot con Google LiteRT-LM y Gemma 4 E2B como motor generativo local avanzado. El modelo se descarga aparte (~2.6 GB), usa GPU cuando está disponible y cae a CPU si es necesario. La ruta automática queda Mistral online -> Gemma 4 LiteRT local -> Qwen2.5 local anterior -> Local básico. Gemma permanece totalmente local incluso con Internet; la búsqueda web no se conecta todavía a este motor durante esta fase de estabilidad."
