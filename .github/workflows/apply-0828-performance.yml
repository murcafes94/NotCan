name: Apply 0.8.28 performance

on:
  push:
    branches: [ "performance-0828" ]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[0828 applied]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-0828
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply performance patch
        run: python3 ci/apply_0828_performance.py
      - name: Build optimized release APK
        run: gradle :app:assembleRelease -PnotcanArm64Only=true --stacktrace
      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Commit validated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/notcan/app/MainActivity.kt \
                  app/src/main/java/com/notcan/app/ui/settings/SettingsScreen.kt \
                  app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No generated runtime changes to commit"
          else
            git commit -m "perf(android): bounded cache, adaptive polling and optimized release [0828 applied]"
            git push origin HEAD:performance-0828
          fi
      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-v0.8.28-performance
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 3
