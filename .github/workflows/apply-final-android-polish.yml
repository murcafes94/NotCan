name: Apply final Android polish

on:
  push:
    paths:
      - 'ci/notcan-final-polish-trigger.txt'
  workflow_dispatch:

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare final Android patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci/apply_final_android_polish.py')
          s = p.read_text(encoding='utf-8')
          marker = 'p = ".github/workflows/android-debug.yml"'
          if marker in s:
              s = s[:s.index(marker)] + 'print("Final Android polish patch applied successfully")\n'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply final Android patch
        run: python3 ci/apply_final_android_polish.py

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'feat(android): finish 0.8.13 class experience'
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          EXPECTED='ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586'
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notcan-0.8.13-final-round
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

      - name: Publish 0.8.13 test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='v0.8.13-test'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$APK#NotCan-v0.8.13-test.apk" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title 'NotCan v0.8.13 · prueba final de ronda' \
            --notes 'Tema claro/oscuro, No molestar de Android, Apuntes como vista principal con navegación discreta, Clases contextual, audio persistente en segundo plano, marcadores navegables, modo lectura/edición de apuntes, selección táctil restaurada, transcriptor mejorado y botones del cuestionario más accesibles.'
