name: Apply 0.8.29 performance

on:
  push:
    branches: [ "performance-0829" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-0829

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply performance patch
        run: python ci/apply_0829_performance.py

      - name: Build release APK
        run: gradle :app:assembleRelease -PnotcanArm64Only=true --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify baseline profile packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" | grep -E 'assets/dexopt/baseline\.(prof|profm)'

      - name: Commit validated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/android-debug.yml
          git commit -m "perf(android): baseline profiles, scoped observers and account calendars [0829 applied]"
          git push origin HEAD:performance-0829

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-v0.8.29-performance
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 3
