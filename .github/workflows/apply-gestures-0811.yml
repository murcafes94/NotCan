name: Apply gestures 0.8.11

on:
  push:
    paths:
      - '.github/trigger-0811-gestures.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply swipe gestures
        run: python3 .github/scripts/apply_0811_gestures.py

      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/notcan/app/ui/ai/StudyQuizScreen.kt \
                  app/src/main/java/com/notcan/app/ui/ai/StudyFlashcardsScreen.kt
          git commit -m "feat(android): add study swipe gestures"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-0.8.11-polish
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Remove temporary patch files
        if: always()
        run: |
          git pull --rebase origin main || true
          git rm -f .github/scripts/apply_0811_gestures.py .github/workflows/apply-gestures-0811.yml .github/trigger-0811-gestures.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove Android 0.8.11 gesture patch files"
            git push origin HEAD:main
          fi
