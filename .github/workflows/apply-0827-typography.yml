name: Apply 0.8.27 typography

on:
  push:
    branches: [ "typography-0827" ]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[0827 applied]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: typography-0827
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply typography patch
        run: python3 ci/apply_0827_typography.py
      - name: Build debug APK
        run: gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace
      - name: Verify persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="ff8909efca133071c208fc1e85a167983115aae2c5de2c84b65f1a2f63f5f586"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "NotCan test signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Commit validated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/notcan/app/ui/home/LocalFontStore.kt \
                  app/src/main/java/com/notcan/app/ui/home/WriterNoteEditor.kt \
                  app/src/main/java/com/notcan/app/ui/home/NoteFileExport.kt \
                  app/src/main/java/com/notcan/app/ui/settings/SettingsScreen.kt \
                  app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "feat(android): add local fonts, calibre and spacing [0827 applied]"
            git push origin HEAD:typography-0827
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notcan-v0.8.27-typography
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
