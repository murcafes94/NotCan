name: Cleanup generated web files

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-web-generated.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop tracking generated web files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --cached --ignore-unmatch web/node_modules web/dist
          git rm --cached --ignore-unmatch web/*.tsbuildinfo

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing generated is tracked."
            exit 0
          fi
          git commit -m "chore(web): stop tracking generated dependencies"
          git push
