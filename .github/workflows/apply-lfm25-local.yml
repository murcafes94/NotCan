name: Apply LFM2.5 Local TuNot Experiment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-lfm25-local.yml

permissions:
  contents: write

# Rerun marker: llama.cpp vendor headers enabled.
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Update llama.cpp revision
        shell: bash
        run: |
          set -euo pipefail
          TARGET=5516b9c16aed771b42403aca9a561af61a564c25
          git -C third_party/llama.cpp fetch origin "$TARGET"
          git -C third_party/llama.cpp checkout --detach "$TARGET"

      - name: Apply Android patch
        run: python3 ci/apply_lfm25_local.py

      - name: Build ARM64 experiment
        run: gradle :app:assembleDebug -PnotcanArm64Only=true --stacktrace

      - name: Commit tested experiment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/notcan/app/ai/NotCanAiService.kt app/src/main/java/com/notcan/app/ai/LocalLfmTuNotEngine.kt app/src/main/java/com/notcan/app/localai/StudyModelManager.kt app/src/main/java/com/notcan/app/ui/settings/SettingsScreen.kt .github/workflows/android-debug.yml third_party/llama.cpp
          git commit -m 'feat(android): test LFM2.5 as optional offline TuNot'
          git push origin HEAD:main
