ce-content:center;text-align:center;background:radial-gradient(circle at center,var(--surface) 56%,transparent 58%),conic-gradient(#7d72ff 0 75%,#303747 75% 100%);box-shadow:inset 0 0 0 1px #ffffff0a}.grade-ring strong{font-size:27px}.grade-ring small{color:var(--muted)}.grade-metrics{display:grid;gap:11px}.grade-metrics div{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}.grade-metrics span{color:var(--muted)}.weight-progress{height:8px;border-radius:999px;background:#282f3d;overflow:hidden}.weight-progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6f79ff,#a66df6)}.target-buttons{display:flex;gap:7px}.target-buttons button{min-width:48px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:700}.target-buttons button.selected{background:#706fff24;border-color:#7775ff;color:#b8b6ff}.needed-result{padding:18px;border-radius:16px;background:linear-gradient(135deg,#706fff16,#9d67ec0d);border:1px solid #7775ff35;display:grid;gap:5px}.needed-result strong{font-size:24px}.needed-result span{color:var(--muted);line-height:1.5}.projection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.projection-grid div{padding:14px;border-radius:13px;background:var(--surface-2);display:grid;gap:4px}.projection-grid small{color:var(--muted)}.projection-grid strong{font-size:21px}.grade-form{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:12px;align-items:end}.grade-form label{display:grid;gap:6px}.grade-form label span{font-size:12px;color:var(--muted);font-weight:700}.grade-form input{width:100%;box-sizing:border-box;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)}.grade-form button{grid-column:1/-1}.grade-message{margin:0;color:#aeb6ff;font-size:13px}.grade-list.enhanced article{grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center}.grade-row-score{display:grid;text-align:right}.grade-row-score span{font-size:12px;color:var(--muted)}
